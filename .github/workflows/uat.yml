name: UAT

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  uat:
    name: Node and browser UAT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run node UAT
        run: |
          node uat/logic-uat.mjs
          node uat/adversarial-uat.mjs
          node uat/art-draw-uat.mjs
          node uat/comic-uat.mjs
          node uat/magic-bolt-uat.mjs
          node uat/chiptune-uat.mjs

      - name: Run browser UAT when Chrome is available
        run: |
          set -euo pipefail
          chrome=""
          if [ -n "${CHROME_PATH:-}" ] && [ -x "${CHROME_PATH}" ]; then
            chrome="${CHROME_PATH}"
          else
            for candidate in \
              /usr/bin/google-chrome \
              /usr/bin/google-chrome-stable \
              /usr/bin/chromium \
              /usr/bin/chromium-browser
            do
              if [ -x "$candidate" ]; then
                chrome="$candidate"
                break
              fi
            done
          fi
          if [ -z "$chrome" ] && [ -n "${CHROME_BIN:-}" ] && [ -x "${CHROME_BIN}" ]; then
            chrome="${CHROME_BIN}"
          fi
          if [ -z "$chrome" ]; then
            for name in google-chrome google-chrome-stable chromium chromium-browser; do
              if command -v "$name" >/dev/null 2>&1; then
                chrome="$(command -v "$name")"
                break
              fi
            done
          fi
          if [ -z "$chrome" ]; then
            echo "Chrome is not available; skipping browser UAT."
            exit 0
          fi

          echo "Using Chrome at ${chrome}"
          npx --yes serve@14.2.8 -l 5173 >/tmp/fernhollow-serve.log 2>&1 &
          server_pid=$!
          cleanup() {
            if kill -0 "$server_pid" >/dev/null 2>&1; then
              kill "$server_pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            echo "Static server did not become ready."
            cat /tmp/fernhollow-serve.log || true
            exit 1
          fi

          CHROME_PATH="$chrome" node uat/browser-uat.mjs
